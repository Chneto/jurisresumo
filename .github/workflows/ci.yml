name: CI / Suíte de Testes Automatizados

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências de Sistema (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libgomp1 libglib2.0-0

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Executar Testes Automatizados
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m pytest tests/ -v -ra --tb=short 2>&1 | tee pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "## Pytest Run Result (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -ne 0 ]; then
            python -c "
with open('pytest_output.txt', 'r', encoding='utf-8', errors='replace') as f:
    for line in f:
        l = line.rstrip()
        if any(w in l for w in ['ERROR', 'Error', 'FAIL', 'FAILED', 'Traceback', 'ImportError', 'ModuleNotFoundError', 'Exception', 'collection', '== ']):
            print(f'::error::{l}')
"
            exit $EXIT_CODE
          fi
